server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,persistence,eventPipeline

spring:
  application:
    name: minipaintdex
  data:
    web:
      pageable:
        default-page-size: 60
        max-page-size: 200
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 1h
  lifecycle:
    timeout-per-shutdown-phase: 30s

minipaintdex:
  root: "${MINIPAINTDEX_ROOT:${user.dir}}"
  application:
    name: Mini Paint Dex
    author: Laurent Sintès
  storage:
    site-configuration: data/site/fr.yaml
    market-paint-catalog-directory: data/market/paints
    workshop-paint-inventory: data/workshop/paints.yaml
    shopping-list: data/workshop/shopping.yaml
    market-paintable-products-directory: data/market/paintable-products
    painting-guides-directory: data/market/painting-guides
    ledger-directory: data/ledger/events
    event-publications-directory: data/ledger/publications
    media-directory: media
    sentinel-enabled: true
    sentinel-interval: 5s
  eventing:
    worker-count: 1
    queue-capacity: 512
    max-attempts: 5
    retry-delay: 250ms
    shutdown-timeout: 25s
  paint-matching:
    candidate-limit: 5
    behavioral-systems:
      - one_coat_shading
      - washing
      - priming
      - effect_application
    color-distance-factor: 2.5
    scores:
      role-mismatch: 20
      metadata-mismatch: 25
      missing-metadata: 50
      empty-behavior: 50
      close-color-threshold: 80
      similar-behavior-threshold: 75
    standard:
      color: 0.65
      role: 0.15
      behavior: 0.00
      finish: 0.08
      coverage: 0.07
      medium: 0.05
    behavioral:
      color: 0.15
      role: 0.35
      behavior: 0.30
      finish: 0.10
      coverage: 0.10
      medium: 0.00
  media:
    max-upload-bytes: 10485760
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
  web:
    allowed-origins:
      - http://127.0.0.1:5173
      - http://localhost:5173
    sse-replay-capacity: 256
    sse-queue-capacity: 512
    sse-connection-timeout: 30m
    sse-heartbeat: 15s
