server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,persistence,eventPipeline

spring:
  application:
    name: minipaintdex
  data:
    web:
      pageable:
        default-page-size: 60
        max-page-size: 200
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 1h
  lifecycle:
    timeout-per-shutdown-phase: 30s

minipaintdex:
  root: "${MINIPAINTDEX_ROOT:${user.dir}}"
  application:
    name: MiniPaintDex
    author: Laurent Sintès
  storage:
    site-configuration: data/site/fr.yaml
    paint-product-catalog-directory: data/market/paints
    rack-catalog: data/market/racks/catalog.yaml
    paint-storage:
      gap-mm: 2.0
      maximum-proposal-pots: 500
    shopping-list: data/workshop/shopping.yaml
    market-paintable-products-directory: data/market/paintable-products
    painting-guides-directory: data/market/painting-guides
    ledger-directory: data/ledger/events
    event-publications-directory: data/ledger/publications
    media-directory: media
    sentinel-enabled: true
    sentinel-interval: 5s
  eventing:
    worker-count: 1
    queue-capacity: 512
    max-attempts: 5
    retry-delay: 250ms
    shutdown-timeout: 25s
  paint-search:
    default-suggestion-limit: 8
    max-suggestion-limit: 20
    max-query-length: 200
    max-terms: 16
    fuzzy-min-length: 5
    max-edits: 1
    max-expansions: 50
    exact-reference-boost: 2000
    exact-name-boost: 1000
    name-boost: 8
    catalog-boost: 3
    metadata-boost: 1
    prefix-boost: 0.8
    fuzzy-boost: 0.2
  paint-matching:
    candidate-limit: 5
    behavioral-systems:
      - one_coat_shading
      - washing
      - priming
      - effect_application
    color-distance-factor: 2.5
    scores:
      role-mismatch: 20
      metadata-mismatch: 25
      missing-metadata: 50
      empty-behavior: 50
      close-color-threshold: 80
      similar-behavior-threshold: 75
    standard:
      color: 0.65
      role: 0.15
      behavior: 0.00
      finish: 0.08
      coverage: 0.07
      medium: 0.05
    behavioral:
      color: 0.15
      role: 0.35
      behavior: 0.30
      finish: 0.10
      coverage: 0.10
      medium: 0.00
  media:
    max-upload-bytes: 10485760
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
  paint-pot-photos:
    enabled: true
    model-path: .tools/models/u2netp.onnx
    model-sha256: 309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8
    max-pixels: 24000000
    max-output-size: 1200
    cpu-threads: 2
    foreground-threshold: 0.1
    padding-ratio: 0.08
  web:
    allowed-origins:
      - http://127.0.0.1:5173
      - http://localhost:5173
    sse-replay-capacity: 256
    sse-queue-capacity: 512
    sse-connection-timeout: 30m
    sse-heartbeat: 15s
