schema_version: 1
recipes:
  - id: reichbusters-reloaded-red-hawk-recipe
    catalog_item_id: reichbusters-reloaded-red-hawk
    paints:
      - paint_id: cit-contrast-guilliman-flesh
        role: Peau — base et ombres
      - paint_id: cit-contrast-aggaros-dunes
        role: Uniforme et toile
      - paint_id: cit-contrast-wyldwood
        role: Cuir et bois sombre
      - paint_id: cit-contrast-gore-grunta-fur
        role: Cuir chaud et cheveux
      - paint_id: vallejo-game-color-metallic-silver
        role: Armes et boucles métalliques
    preparation:
      - title: Nettoyer
        detail: Laver la figurine à l’eau tiède avec une goutte de liquide vaisselle, rincer puis laisser sécher complètement.
      - title: Ébarber
        detail: Retirer doucement les lignes de moulage. Éviter de forcer sur les armes et accessoires fins.
      - title: Sous-coucher
        detail: Appliquer une couche noire fine, puis un zénithal blanc léger depuis le dessus pour rendre les volumes lisibles.
    painting:
      - title: Peau
        detail: Poser Guilliman Flesh en couche contrôlée. Reprendre les reliefs avec une teinte chair claire si nécessaire.
      - title: Uniforme
        detail: Appliquer Aggaros Dunes sur les tissus, en évitant les cuirs. Renforcer les plis profonds avec une seconde passe localisée.
      - title: Cuir et bois
        detail: Utiliser Wyldwood dans les creux et Gore-Grunta Fur sur les zones plus chaudes ou exposées.
      - title: Métaux
        detail: Peindre l’arme en sombre, poser Silver sur les arêtes et garder du noir dans les creux.
      - title: Finitions
        detail: Corriger les débordements, éclaircir les volumes supérieurs puis protéger avec un vernis mat.
  - id: reichbusters-reloaded-sarge-recipe
    catalog_item_id: reichbusters-reloaded-sarge
    paints:
      - paint_id: cit-contrast-aggaros-dunes
        role: Uniforme
      - paint_id: cit-contrast-wyldwood
        role: Bottes et sangles
      - paint_id: cit-contrast-guilliman-flesh
        role: Visage et mains
      - paint_id: vallejo-game-color-metallic-silver
        role: Arme et boucles
    preparation:
      - title: Nettoyer
        detail: Laver la figurine à l’eau tiède avec une goutte de liquide vaisselle, rincer puis laisser sécher complètement.
      - title: Ébarber
        detail: Retirer doucement les lignes de moulage. Éviter de forcer sur les armes et accessoires fins.
      - title: Sous-coucher
        detail: Appliquer une couche noire fine, puis un zénithal blanc léger depuis le dessus pour rendre les volumes lisibles.
    painting:
      - title: Grandes zones
        detail: Poser d’abord les vêtements et l’équipement, en gardant les zones de peau propres.
      - title: Peau
        detail: Appliquer la teinte chair en couche contrôlée puis reprendre les reliefs du visage et des mains.
      - title: Matériaux
        detail: Distinguer cuir, tissu et métal par des finitions et des éclaircissements différents.
      - title: Point focal
        detail: "Renforcer le visage et l’arme principale : ce sont les zones qui doivent se lire en premier."
      - title: Protection
        detail: Après séchage complet, protéger la figurine avec un vernis mat en couche fine.
