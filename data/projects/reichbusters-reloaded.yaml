        role: Langue et blessures
        color_hex: "#a72f32"
        pending_import: true
    preparation:
      - title: Nettoyer
        detail: Laver la figurine à l’eau tiède avec une goutte de liquide vaisselle, rincer puis laisser sécher complètement.
      - title: Ébarber
        detail: Retirer doucement les lignes de moulage. Éviter de forcer sur les armes et accessoires fins.
      - title: Sous-coucher
        detail: Appliquer une couche noire fine, puis un zénithal blanc léger depuis le dessus pour rendre les volumes lisibles.
    painting:
      - title: Travail en série
        detail: Préparer quatre figurines à la fois et terminer une couleur sur tout le groupe avant de passer à la suivante.
      - title: Aplats
        detail: Poser les couleurs principales en couches fines, sans remplir les détails ni les creux.
      - title: Ombres
        detail: Appliquer un lavis sombre localisé, puis laisser sécher complètement.
      - title: Reliefs
        detail: Reprendre les épaules, têtes, genoux et armes avec la couleur de base ou une teinte plus claire.
      - title: Socles
        detail: Traiter tous les socles de la même manière pour rendre le groupe identifiable sur le plateau.
