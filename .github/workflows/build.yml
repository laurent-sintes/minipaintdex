name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Install data tools
        run: python -m pip install -e './tools/minipaintdex-data[images]'

      - name: Test data tools
        run: python -m unittest discover -s tools/minipaintdex-data/tests

      - name: Validate and build the self-contained system
        run: ./mvnw clean verify
