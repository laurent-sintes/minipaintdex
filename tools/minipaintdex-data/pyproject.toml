[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minipaintdex-data"
version = "0.1.0"
description = "Deterministic import, change-set and repository tools for MiniPaintDex"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
images = ["Pillow>=11,<13"]

[project.scripts]
mpdx-data = "minipaintdex_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
